[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradevodata"
version = "0.1.0"
description = "Point-in-time US equity fundamentals from SEC EDGAR — every value stamped with the date it became public"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Christian Pichichero" }]
keywords = [
    "finance", "fundamentals", "sec", "edgar", "point-in-time", "pit",
    "backtesting", "lookahead-bias", "quant", "xbrl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
# Zero required dependencies — stdlib only. pandas is opt-in.
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7", "pandas>=1.3"]

[project.urls]
Homepage = "https://tradevodata.com"
Documentation = "https://tradevodata.com/docs"
Source = "https://github.com/christianpichichero-max/tradevodata-py"
"Free sample" = "https://github.com/christianpichichero-max/pit-fundamentals"
Changelog = "https://tradevodata.com/changelog"

[tool.hatch.build.targets.wheel]
packages = ["src/tradevodata"]
